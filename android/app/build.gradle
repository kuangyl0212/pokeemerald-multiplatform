plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pokeemerald.experimental'
    compileSdk 36
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.pokeemerald.experimental'
        minSdk 21
        targetSdk 36
        versionCode 3
        versionName '0.3.0-zh-cn'

        ndk {
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets.main.java.srcDirs += '../SDL2/android-project/app/src/main/java'
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/borderAssets'))

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
}

tasks.register('copyBorderAsset', Sync) {
    from(rootProject.file('..')) {
        include 'BG*.png'
        include 'Border.png'
    }
    into layout.buildDirectory.dir('generated/borderAssets')
}

// Android 端 SDL2 不带 SDL2_image，需将 Border.png 预转换为带 alpha 的 BMP4 格式，
// 以便 C 代码用 SDL_LoadBMP_RW 加载边框纹理并保留半透明效果。
// 依赖系统已安装 ImageMagick (magick 命令)。WSL Ubuntu 默认含此命令。
tasks.register('convertBorderToBmp', Exec) {
    def srcPng = rootProject.file('../Border.png').absolutePath
    def dstBmp = layout.buildDirectory.file('generated/borderAssets/Border.bmp').get().asFile
    inputs.file srcPng
    outputs.file dstBmp
    doFirst {
        dstBmp.parentFile.mkdirs()
    }
    commandLine 'magick', srcPng, '-define', 'bmp:format=bmp4', dstBmp.absolutePath
}

tasks.named('copyBorderAsset').configure {
    dependsOn tasks.named('convertBorderToBmp')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('copyBorderAsset')
}
